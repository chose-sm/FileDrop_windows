<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FileDrop">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>FileDrop</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #8e8e93;
    --line: #e5e5ea; --accent: #0a84ff; --danger: #ff3b30; --ok: #34c759;
    --drop: rgba(10,132,255,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1c1c1e; --text: #f2f2f7; --muted: #8e8e93;
      --line: #2c2c2e; --drop: rgba(10,132,255,.16);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px calc(40px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header svg { width: 40px; height: 40px; flex: none; }
  header > div { min-width: 0; flex: 1; }
  .titleRow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -.5px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .lang {
    display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 18px;
    padding: 4px 6px 4px 10px; color: var(--muted); font-size: 13px;
  }
  .lang svg { width: 16px; height: 16px; flex: none; }
  .lang select { border: 0; padding: 2px 4px; background: transparent; font-size: 14px; font-weight: 500; cursor: pointer; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted);
       font-weight: 600; margin: 0 0 8px 4px; display: flex; align-items: center; gap: 8px; }
  h2 .grow { flex: 1; }
  .grid { display: grid; gap: 20px; }
  @media (min-width: 820px) { .grid.pc { grid-template-columns: 300px 1fr; } }
  .card { background: var(--card); border-radius: 14px; padding: 16px; }
  section { margin-bottom: 20px; }
  .qr { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  #qr { background: #fff; padding: 12px; border-radius: 12px; line-height: 0; }
  #qr img, #qr canvas { width: 220px; height: 220px; }
  .url { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); word-break: break-all; }
  select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); max-width: 100%; }
  .drop {
    display: block; border: 2px dashed var(--line); border-radius: 14px; padding: 28px 16px; text-align: center;
    cursor: pointer; transition: .15s; background: var(--card);
  }
  .drop.over { border-color: var(--accent); background: var(--drop); }
  .drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: 14px; }
  .btn {
    appearance: none; border: 0; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; padding: 12px 18px; text-decoration: none; display: inline-flex;
    align-items: center; justify-content: center; gap: 8px;
  }
  .btn.big { width: 100%; font-size: 18px; padding: 18px; border-radius: 14px; }
  .btn.small { padding: 6px 12px; font-size: 14px; border-radius: 16px; }
  .btn.ghost { background: transparent; color: var(--accent); padding: 4px 8px; font-size: 14px; font-weight: 500; }
  .btn.ghost.red { color: var(--danger); }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .thumb {
    width: 44px; height: 44px; border-radius: 8px; flex: none; background: var(--bg); overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    color: var(--muted); text-transform: uppercase;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .meta { flex: 1; min-width: 0; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 4px; flex: none; align-items: center; }
  .empty { padding: 22px 14px; text-align: center; color: var(--muted); font-size: 14px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .done .bar i { background: var(--ok); }
  .fail .bar i { background: var(--danger); }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 4px 0; }
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 22px; font-size: 14px;
    opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); z-index: 40;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .offline { color: var(--danger); }
  /* --- iPhone: výber, lišta, prehliadač --- */
  .selectable .item { cursor: pointer; -webkit-user-select: none; user-select: none; }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: none;
           display: flex; align-items: center; justify-content: center; transition: .15s; }
  .item.sel { background: var(--drop); }
  .item.sel .check { background: var(--accent); border-color: var(--accent); }
  .item.sel .check::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0;
                            transform: translateY(-1px) rotate(45deg); }
  .selbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom));
    width: min(560px, calc(100% - 32px)); background: var(--card); border-radius: 16px; z-index: 35;
    box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px;
  }
  .selbar span { flex: 1; font-weight: 600; font-size: 15px; }
  .btn:disabled { opacity: .5; }
  body.hasbar main { padding-bottom: 110px; }
  body.hasbar #toast { bottom: calc(90px + env(safe-area-inset-bottom)); }
  body.noscroll { overflow: hidden; }
  body.noscroll #selBar:not(.busy) { display: none; }
  .overlay { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
  .vbar { display: flex; align-items: center; gap: 8px; background: var(--card); border-bottom: 1px solid var(--line);
          padding: calc(8px + env(safe-area-inset-top)) 8px 8px; }
  .vbar .btn.ghost { font-size: 17px; font-weight: 600; padding: 6px 8px; gap: 2px; }
  .vname { flex: 1; min-width: 0; text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vbody { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center;
           padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .vbody img, .vbody video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
  .vfile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; max-width: 100%; }
  .vfile .name { white-space: normal; overflow-wrap: anywhere; }
  .thumb.big { width: 96px; height: 96px; font-size: 18px; border-radius: 16px; background: var(--card); }
  .doc { display: block; }
  .doc > div { max-width: 560px; margin: 0 auto; }
  .doc ol { padding-left: 22px; margin: 16px 0; }
  .doc li { margin-bottom: 14px; }
  .doc .btn { margin-top: 8px; }
  .fp { width: 100%; text-align: left; font-size: 13px; }
  .fp summary { cursor: pointer; color: var(--accent); text-align: center; }
  .fp .url { margin: 8px 0 4px; line-height: 1.6; }
  .warn { background: rgba(255,159,10,.15); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .banner { margin-bottom: 20px; }
  .banner strong { display: block; margin-bottom: 2px; }
  .banner .actions { margin-top: 12px; gap: 8px; }
  .rowbtns { display: flex; gap: 8px; margin-top: 8px; }
  .btn.tint { background: var(--drop); color: var(--accent); }
  .selectable .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30c48d"/><stop offset="1" stop-color="#0a84ff"/></linearGradient></defs>
      <rect width="40" height="40" rx="10" fill="url(#g)"/>
      <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 28V12M10 17l5-5 5 5"/><path d="M25 12v16M20 23l5 5 5-5"/>
      </g>
    </svg>
    <div>
      <div class="titleRow">
        <h1>FileDrop</h1>
        <label class="lang" title="Language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
          </svg>
          <select id="lang" aria-label="Language">
            <option value="sk">Slovenčina</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <p id="status" data-i18n="connecting"></p>
    </div>
  </header>

  <!-- ===== Režim PC ===== -->
  <div id="pc" class="grid pc" hidden>
    <div>
      <div class="card qr">
        <div id="qr"></div>
        <div>
          <strong data-i18n="scanTitle"></strong>
          <div class="sub" data-i18n="scanSub"></div>
        </div>
        <select id="ipSel" hidden></select>
        <div class="url" id="url"></div>
        <details class="fp" id="fpBox" hidden>
          <summary data-i18n="fpTitle"></summary>
          <div class="url" id="fp"></div>
          <div class="sub" data-i18n="fpHint"></div>
        </details>
      </div>
      <p class="hint" data-i18n-html="homeTip"></p>
    </div>
    <div>
      <section>
        <h2 data-i18n="sendToIphone"></h2>
        <label class="drop" id="drop">
          <strong data-i18n="dropTitle"></strong>
          <span data-i18n="dropSub"></span>
          <input type="file" id="pcFiles" multiple hidden>
        </label>
        <div class="list" id="pcUploads" hidden style="margin-top:12px"></div>
      </section>
      <section>
        <h2><span class="grow" data-i18n="readyForIphone"></span>
          <button class="btn ghost red" id="clearOut" hidden data-i18n="clearAll"></button></h2>
        <div class="list" id="outList"></div>
      </section>
      <section>
        <h2><span class="grow" data-i18n="receivedFromIphone"></span>
          <button class="btn ghost" id="openInbox" data-i18n="openFolder"></button></h2>
        <div class="list" id="inList"></div>
      </section>
    </div>
  </div>

  <!-- ===== Režim iPhone ===== -->
  <div id="phone" hidden>
    <div class="card banner" id="httpsBanner" hidden>
      <div><strong data-i18n="httpsTitle"></strong><span class="sub" data-i18n="httpsText"></span></div>
      <div class="actions">
        <button class="btn small" id="httpsSetup" data-i18n="setup"></button>
        <button class="btn ghost" id="httpsLater" data-i18n="later"></button>
      </div>
    </div>
    <section>
      <label class="btn big">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
        <span data-i18n="sendToPc"></span>
        <input type="file" id="phoneFiles" multiple hidden>
      </label>
      <p class="hint" data-i18n="phoneHint"></p>
      <div class="list" id="phoneUploads" hidden style="margin-top:12px"></div>
    </section>
    <section>
      <h2><span class="grow" data-i18n="fromPc"></span>
        <button class="btn ghost" id="selectAll" hidden></button></h2>
      <div class="list" id="phoneList"></div>
      <p class="hint" id="saveHint"></p>
      <p class="hint" id="httpsLinkRow" hidden><button class="btn ghost" id="httpsLink" data-i18n="setupLink" style="padding:0"></button></p>
    </section>
  </div>
</main>

<div class="selbar" id="selBar" hidden>
  <span id="selText"></span>
  <button class="btn" id="selSave"></button>
</div>

<!-- prehliadač súboru (iPhone) -->
<div class="overlay" id="viewer" hidden>
  <div class="vbar">
    <button class="btn ghost back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="back"></span></button>
    <div class="vname" id="vName"></div>
    <button class="btn small" id="vSave" data-i18n="save"></button>
  </div>
  <div class="vbody" id="vBody"></div>
</div>

<!-- návod na HTTPS (iPhone) -->
<div class="overlay" id="setup" hidden>
  <div class="vbar">
    <button class="btn ghost back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="back"></span></button>
    <div class="vname" data-i18n="setupTitle"></div>
    <label class="lang" title="Language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
      </svg>
      <select id="guideLang" aria-label="Language">
        <option value="en">English</option>
        <option value="sk">Slovenčina</option>
      </select>
    </label>
  </div>
  <div class="vbody doc"><div>
    <p data-i18n="setupIntro"></p>
    <p class="warn" data-i18n-html="setupSafety"></p>
    <p class="warn" id="setupSafari" data-i18n-html="setupStandalone" hidden></p>
    <ol>
      <li><span data-i18n-html="step1"></span><br><a class="btn small" href="/filedrop-ca.crt" data-i18n="downloadCert"></a></li>
      <li data-i18n-html="step2"></li>
      <li data-i18n-html="step3"></li>
      <li><span data-i18n-html="step4"></span><br><button class="btn small" id="certCheck" data-i18n="check"></button></li>
    </ol>
    <p class="hint" data-i18n="setupNote"></p>
  </div></div>
</div>
<div id="toast"></div>

<script src="/qrcode.min.js"></script>

      dropSub: 'or click to choose · Ctrl+V works too',
      readyForIphone: 'Ready for iPhone',
      clearAll: 'Clear all',
      receivedFromIphone: 'Received from iPhone',
      openFolder: 'Open folder',
      sendToPc: 'Send to PC',
      phoneHint: 'Pick photos, videos or files. They are saved to the FileDrop folder on the PC.',
      fromPc: 'From the PC',
      phoneSaveHint: 'Tap the files you want to save (or <b>Select all</b>), then tap <b>Save</b>. In the menu choose <b>Save Images</b> (to Photos) or <b>Save to Files</b>.',
      phoneSaveHintHttp: 'Tap the files you want to save (or <b>Select all</b>), then tap <b>Save</b> – they are downloaded to the Files app. To save several photos straight to Photos, turn on the secure connection.',
      save: 'Save',
      saveN: n => `Save (${n})`,
      selectAll: 'Select all',
      selectNone: 'Deselect all',
      selected: n => `Selected: ${n}`,
      preparing: (i, n) => `Preparing ${i}/${n}…`,
      tapToSave: 'Ready – tap Save',
      saveFailed: 'Saving failed.',
      back: 'Back',
      openInBrowser: 'Open in Safari',
      secureOn: 'secure',
      httpsTitle: 'Save many photos at once',
      httpsText: 'Needs a one-time secure connection setup (about a minute).',
      setup: 'Set up',
      later: 'Not now',
      setupLink: 'Turn on secure connection (HTTPS)',
      setupSafety: '<b>Only install the certificate at home, on your own Wi-Fi, and only from your own computer.</b> Never install a FileDrop certificate from someone else\'s PC.',
      fpTitle: 'Certificate fingerprint (SHA-256)',
      fpHint: 'When installing on the iPhone, compare it under More Details – it must match.',
      setupTitle: 'Secure connection',
      setupIntro: 'The iPhone only allows saving several files at once (to Photos or Files) over a secure HTTPS connection. You just need to install the FileDrop certificate once.',
      setupStandalone: 'Open this guide in <b>Safari</b>, not from the Home Screen icon – otherwise the certificate will not download.',
      step1: 'Tap the button and confirm <b>Allow</b>, then <b>Close</b>.',
      downloadCert: 'Download certificate',
      step2: 'Open <b>Settings</b> → <b>Profile Downloaded</b> at the top. First tap <b>More Details</b> → the certificate and check that the <b>SHA-256 fingerprint</b> matches the one on the PC screen (below the QR code). If it does, go back and tap <b>Install</b> → enter your passcode → <b>Install</b>. If it differs, do not install it. Profile not there? Settings → General → <b>VPN &amp; Device Management</b>.',
      step3: 'Settings → General → <b>About</b> → at the bottom <b>Certificate Trust Settings</b> → turn on <b>FileDrop Local CA</b> → Continue.',
      step4: 'Come back here and tap <b>Check</b>.',
      check: 'Check',
      checking: 'Checking…',
      notYet: 'Not working yet – check step 3.',
      setupNote: 'The certificate only works for devices in your home network (private IP addresses), so it cannot be misused for other websites. If FileDrop is on your Home Screen, remove it and add it again after switching.',
      today: 'today',
      waiting: 'Waiting…',
      of: 'of',
      done: 'Done',
      failed: 'Error – try again',
      readyCount: n => `Ready for iPhone: ${n}`,
      sentCount: n => `Sent to PC: ${n}`,
      failedCount: n => `Failed to send: ${n}`,
      remove: 'Remove',
      open: 'Open',
      download: 'Download',
      outEmpty: 'Nothing here yet. Drop files above.',
      inEmpty: 'Nothing received yet.',
      phoneEmpty: 'Nothing yet. On the PC, drop files into the FileDrop window.',
      confirmClear: 'Remove all files ready for the iPhone?',
      qrOffline: 'The QR code could not be shown. Type the address below into Safari on the iPhone.',
      revealed: 'Executable file – for safety it is only highlighted in its folder.',
      received: name => 'Received: ' + name,
      receivedCount: n => `Files received: ${n}`,
      thisPc: 'This PC',
      connected: 'Connected to PC',
      offline: 'Lost connection to the PC – is FileDrop running?',
    },
  };
  function loadLang() {
    try {
      const s = localStorage.getItem('filedrop-lang') || localStorage.getItem('airdrop-lang');
      if (STRINGS[s]) return s;
    } catch {}
    return /^(sk|cs)\b/i.test(navigator.language || '') ? 'sk' : 'en';
  }
  let lang = loadLang();
  const t = (k, ...args) => { const v = STRINGS[lang][k]; return typeof v === 'function' ? v(...args) : v; };
  let guideLang = 'en';  // návod na certifikát je predvolene po anglicky
  try { if (STRINGS[localStorage.getItem('filedrop-guide-lang')]) guideLang = localStorage.getItem('filedrop-guide-lang'); } catch {}
  const tg = k => STRINGS[guideLang][k];

  function applyLang() {
    document.documentElement.lang = lang;
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach(e => {
      e.textContent = (e.closest('#setup') ? tg : t)(e.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-html]').forEach(e => {
      e.innerHTML = (e.closest('#setup') ? tg : t)(e.dataset.i18nHtml);
    });
    $('guideLang').value = guideLang;
    $('setup').lang = guideLang;
    $('ipSel').title = t('netIface');
  }
  $('guideLang').onchange = e => {
    guideLang = e.target.value;
    try { localStorage.setItem('filedrop-guide-lang', guideLang); } catch {}
    applyLang();
  };
  $('lang').onchange = e => {
    lang = e.target.value;
    try { localStorage.setItem('filedrop-lang', lang); } catch {}
    applyLang();
    if (state) {
      if (state.local && !window.QRCode) drawQr();
      lastJson = '';
      refresh();
    }
  };
  applyLang();

  let state = null, lastJson = '', knownInbox = null, chosenUrl = null;

  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    const u = ['KB', 'MB', 'GB']; let i = -1;
    do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
    return b.toFixed(b < 10 ? 1 : 0) + ' ' + u[i];
  }
  function fmtTime(ts) {
    const d = new Date(ts * 1000), now = new Date(), loc = t('locale');
    const hm = d.toLocaleTimeString(loc, { hour: '2-digit', minute: '2-digit' });
    return d.toDateString() === now.toDateString() ? t('today') + ' ' + hm : d.toLocaleDateString(loc) + ' ' + hm;
  }
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2600);
  }
  function el(tag, props = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
      else if (k in e) e[k] = v; else e.setAttribute(k, v);
    }
    kids.flat().forEach(c => c != null && e.append(c));
    return e;
  }
  const post = url => fetch(withKey(url), { method: 'POST', headers: { 'X-FileDrop': '1' } });

  function thumb(box, f) {
    const ext = (f.name.split('.').pop() || '').slice(0, 4);
    const th = el('div', { className: 'thumb' }, ext);
    if (f.type.startsWith('image/') && !/heic|heif/.test(f.type)) {
      const img = el('img', { alt: '', src: fileUrl(box, f.name) });
      img.onload = () => { th.textContent = ''; th.append(img); };
    }
    return th;
  }

  function renderList(container, box, files, emptyText, actions) {
    container.replaceChildren(...(files.length ? files.map(f =>
      el('div', { className: 'item' },
        thumb(box, f),
        el('div', { className: 'meta' },
          el('div', { className: 'name', title: f.name }, f.name),
          el('div', { className: 'sub' }, fmtSize(f.size) + ' · ' + fmtTime(f.time))),
        el('div', { className: 'actions' }, actions(f)))
    ) : [el('div', { className: 'empty' }, emptyText)]));
  }

  // ---------- nahrávanie (oba smery) ----------
  const queue = [];
  let busy = false;
  function enqueue(files, listEl) {
    for (const file of files) {
      const bar = el('i');
      const sub = el('div', { className: 'sub' }, t('waiting') + ' · ' + fmtSize(file.size));
      const row = el('div', { className: 'item' },
        el('div', { className: 'meta' }, el('div', { className: 'name' }, file.name), sub,
          el('div', { className: 'bar' }, bar)));
      listEl.hidden = false;
      listEl.prepend(row);
      queue.push({ file, bar, sub, row, listEl });
    }
    pump();
  }
  async function pump() {
    if (busy) return;
    busy = true;
    let ok = 0, failed = 0;
    while (queue.length) {
      const job = queue.shift();
      try { await send(job); ok++; } catch { failed++; }
    }
    busy = false;
    refresh();
    if (ok) toast(state && state.local ? t('readyCount', ok) : t('sentCount', ok));
    if (failed) toast(t('failedCount', failed));
  }
  function send({ file, bar, sub, row, listEl }) {
    return new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      const started = Date.now();
      x.open('POST', withKey('/api/upload?name=' + encodeURIComponent(file.name) + '&mtime=' + (file.lastModified || '')));
      x.setRequestHeader('X-FileDrop', '1');
      x.upload.onprogress = e => {
        if (!e.lengthComputable) return;
        const pct = e.loaded / e.total * 100, secs = (Date.now() - started) / 1000;
        bar.style.width = pct + '%';
        sub.textContent = `${Math.round(pct)} % · ${fmtSize(e.loaded)} ${t('of')} ${fmtSize(e.total)}` +
          (secs > 1 ? ` · ${fmtSize(e.loaded / secs)}/s` : '');
      };
      const finish = good => {
        row.classList.add(good ? 'done' : 'fail');
        bar.style.width = '100%';
        sub.textContent = good ? t('done') + ' · ' + fmtSize(file.size) : t('failed');
        if (good) setTimeout(() => { row.remove(); if (!listEl.children.length) listEl.hidden = true; }, 2500);
        good ? resolve() : reject();
      };
      x.onload = () => finish(x.status === 200);
      x.onerror = x.onabort = () => finish(false);
      x.send(file);
    });
  }

  // ---------- režim PC ----------
  function initPc() {
    $('pc').hidden = false;
    const drop = $('drop');
    $('pcFiles').onchange = e => { enqueue([...e.target.files], $('pcUploads')); e.target.value = ''; };
    ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.add('over');
    }));
    ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
      e.preventDefault();
      if (ev === 'drop' || !e.relatedTarget) drop.classList.remove('over');
    }));
    document.addEventListener('drop', e => {
      const files = [...(e.dataTransfer?.files || [])];
      if (files.length) enqueue(files, $('pcUploads'));
    });
    document.addEventListener('paste', e => {
      const files = [...(e.clipboardData?.files || [])];
      if (files.length) { e.preventDefault(); enqueue(files, $('pcUploads')); }
    });
    $('openInbox').onclick = () => post('/api/open?box=inbox');
    $('clearOut').onclick = async () => {
      if (confirm(t('confirmClear'))) { await post('/api/clear'); refresh(); }
    };
    $('ipSel').onchange = e => { chosenUrl = e.target.value; drawQr(); };
  }
  function drawQr() {
    const url = chosenUrl || state.urls[0];
    $('url').textContent = url;
    const box = $('qr');
    box.replaceChildren();
    if (window.QRCode) new QRCode(box, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
    else box.replaceChildren(el('div', { className: 'url', style: 'color:#333;padding:20px;line-height:1.4' }, t('qrOffline')));
  }
  function renderPc() {
    const sel = $('ipSel');
    if (!chosenUrl || !state.urls.includes(chosenUrl)) chosenUrl = state.urls[0];
    if (sel.options.length !== state.urls.length) {
      sel.replaceChildren(...state.urls.map(u => el('option', { value: u }, new URL(u).hostname)));
      sel.hidden = state.urls.length < 2;
      sel.value = chosenUrl;
      drawQr();
    }
    $('fpBox').hidden = !state.caFingerprint;
    $('fp').textContent = state.caFingerprint || '';
    $('clearOut').hidden = !state.outbox.length;
    renderList($('outList'), 'outbox', state.outbox, t('outEmpty'), f => [
      el('button', { className: 'btn ghost red', on: { click: async () => {
        await post(`/api/delete?box=outbox&name=${encodeURIComponent(f.name)}`); refresh();
      } } }, t('remove'))]);
    renderList($('inList'), 'inbox', state.inbox, t('inEmpty'), f => [
      el('button', { className: 'btn ghost', on: { click: async () => {
        const r = await post(`/api/open?box=inbox&name=${encodeURIComponent(f.name)}`);
        if (r.ok && (await r.json()).revealed) toast(t('revealed'));
      } } }, t('open'))]);

    const names = new Set(state.inbox.map(f => f.name));
    if (knownInbox) {
      const fresh = state.inbox.filter(f => !knownInbox.has(f.name));
      if (fresh.length) toast(fresh.length === 1 ? t('received', fresh[0].name) : t('receivedCount', fresh.length));
    }
    knownInbox = names;
  }

  // ---------- režim iPhone ----------
  const selected = new Set();
  let pending = null, saving = false, httpsOffered = false;

  function canShare(files) {
    try { return !!(navigator.canShare && navigator.canShare({ files })); } catch { return false; }
  }
  const shareSupported = () => canShare([new File(['x'], 'x.txt', { type: 'text/plain' })]);

  function initPhone() {
    $('phone').hidden = false;
    $('phoneFiles').onchange = e => { enqueue([...e.target.files], $('phoneUploads')); e.target.value = ''; };
    $('selectAll').onclick = () => {
      const all = selected.size === state.outbox.length;
      selected.clear();
      if (!all) state.outbox.forEach(f => selected.add(f.name));
      renderPhone();
    };
    $('selSave').onclick = () => pending ? shareNow(pending)
      : saveFiles(state.outbox.filter(f => selected.has(f.name)));
    document.querySelectorAll('.overlay .back').forEach(b => { b.onclick = () => history.back(); });
    window.addEventListener('popstate', hideOverlays);
    $('httpsSetup').onclick = $('httpsLink').onclick = () => {
      $('setupSafari').hidden = !navigator.standalone;
      showOverlay('setup');
    };
    $('httpsLater').onclick = () => {
      try { localStorage.setItem('filedrop-https-later', '1'); } catch {}
      updateHttpsBanner();
    };
    $('certCheck').onclick = async () => {
      const b = $('certCheck');
      b.disabled = true;
      b.textContent = tg('checking');
      if (await httpsReachable()) return location.replace(httpsUrl());
      b.disabled = false;
      b.textContent = tg('check');
      toast(tg('notYet'));
    };
    checkHttps();
  }

  function renderPhone() {
    const names = new Set(state.outbox.map(f => f.name));
    for (const n of [...selected]) if (!names.has(n)) selected.delete(n);
    const list = $('phoneList');
    list.classList.toggle('selectable', state.outbox.length > 0);
    list.replaceChildren(...(state.outbox.length ? state.outbox.map(f => {
      const row = el('div', { className: 'item' + (selected.has(f.name) ? ' sel' : ''), on: { click: e => {
        if (e.target.closest('.rowbtns')) return;
        selected.has(f.name) ? selected.delete(f.name) : selected.add(f.name);
        row.classList.toggle('sel', selected.has(f.name));
        updateSelBar();
      } } },
        el('div', { className: 'check' }),
        thumb('outbox', f),
        el('div', { className: 'meta' },
          el('div', { className: 'name', title: f.name }, f.name),
          el('div', { className: 'sub' }, fmtSize(f.size) + ' · ' + fmtTime(f.time)),
          el('div', { className: 'rowbtns' },
            el('button', { className: 'btn small tint', on: { click: () => openViewer(f) } }, t('open')),
            el('button', { className: 'btn small', on: { click: () => saveFiles([f]) } }, t('save')))));
      return row;
    }) : [el('div', { className: 'empty' }, t('phoneEmpty'))]));
    $('selectAll').hidden = !state.outbox.length;
    $('saveHint').innerHTML = t(shareSupported() ? 'phoneSaveHint' : 'phoneSaveHintHttp');
    updateSelBar();
    updateHttpsBanner();
  }

  // lišta dole: počet vybraných a tlačidlo Uložiť
  function setBar(text, button, disabled) {
    $('selBar').hidden = false;
    $('selBar').classList.add('busy');
    document.body.classList.add('hasbar');
    $('selText').textContent = text;
    $('selSave').textContent = button;
    $('selSave').disabled = !!disabled;
  }
  function updateSelBar() {
    const n = selected.size;
    $('selectAll').textContent = state && n && n === state.outbox.length ? t('selectNone') : t('selectAll');
    if (pending) return setBar(t('tapToSave'), t('save'));
    if (saving) return;
    $('selBar').classList.remove('busy');
    $('selBar').hidden = n === 0;
    document.body.classList.toggle('hasbar', n > 0);
    $('selText').textContent = t('selected', n);
    $('selSave').textContent = t('saveN', n);
    $('selSave').disabled = false;
  }

  // uloženie: cez HTTPS menu Zdieľať (Fotky / Súbory), inak stiahnutie do Súborov
  async function saveFiles(list) {
    if (!list.length || saving) return;
    saving = true;
    pending = null;
    try {
      if (!shareSupported()) {
        for (const f of list) await downloadFile(f);
        return;
      }
      const files = [];
      for (const [i, f] of list.entries()) {
        setBar(t('preparing', i + 1, list.length), t('save'), true);
        const r = await fetch(fileUrl('outbox', f.name), { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        files.push(new File([await r.blob()], f.name,
          { type: f.type || 'application/octet-stream', lastModified: f.time * 1000 }));
      }
      if (!canShare(files)) {
        for (const f of list) await downloadFile(f);
        return;
      }
      saving = false;
      await shareNow(files);
    } catch {
      toast(t('saveFailed'));
    } finally {
      saving = false;
      updateSelBar();
    }
  }
  async function shareNow(files) {
    pending = null;
    try {
      await navigator.share({ files });
      selected.clear();
      renderPhone();
    } catch (e) {
      // iOS vyžaduje ťuknutie tesne pred zdieľaním; po dlhšej príprave treba ťuknúť ešte raz
      if (e.name === 'NotAllowedError') pending = files;
      else if (e.name !== 'AbortError') toast(t('saveFailed'));
    }
    updateSelBar();
  }
  async function downloadFile(f) {
    const a = el('a', { href: fileUrl('outbox', f.name, true), download: f.name });
    document.body.append(a);
    a.click();
    a.remove();
    await new Promise(r => setTimeout(r, 800));
  }

  // prehliadač súboru so šípkou späť (funguje aj gesto zo strany)
  function openViewer(f) {
    const url = fileUrl('outbox', f.name);
    let body;
    if (f.type.startsWith('image/')) body = el('img', { src: url, alt: f.name });
    else if (f.type.startsWith('video/')) body = el('video', { src: url, controls: true, playsInline: true, preload: 'metadata' });
    else if (f.type.startsWith('audio/')) body = el('audio', { src: url, controls: true });
    else body = el('div', { className: 'vfile' },
      el('div', { className: 'thumb big' }, (f.name.split('.').pop() || '').slice(0, 4)),
      el('div', { className: 'name' }, f.name),
      el('div', { className: 'sub' }, fmtSize(f.size)),
      el('a', { className: 'btn ghost', href: url, target: '_blank', rel: 'noopener' }, t('openInBrowser')));
    $('vName').textContent = f.name;
    $('vSave').onclick = () => saveFiles([f]);
    $('vBody').replaceChildren(body);
    showOverlay('viewer');
  }
  function showOverlay(id) {
    $(id).hidden = false;
    document.body.classList.add('noscroll');
    history.pushState({ overlay: id }, '');
  }
  function hideOverlays() {
    $('viewer').hidden = $('setup').hidden = true;
    $('vBody').replaceChildren();
    document.body.classList.remove('noscroll');
  }

  // HTTPS: ak iPhone už dôveruje certifikátu, prepni sa naň; inak ponúkni návod
  const httpsUrl = () => `https://${location.host}${location.pathname}${location.search}`;
  async function httpsReachable() {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 4000);
    try {
      await fetch(`https://${location.host}/ping`, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal });
      return true;
    } catch {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }
  async function checkHttps() {
    if (location.protocol !== 'http:' || !state.https) return;
    if (await httpsReachable()) return location.replace(httpsUrl());
    httpsOffered = true;
    updateHttpsBanner();
  }
  function updateHttpsBanner() {
    let later = false;
    try { later = localStorage.getItem('filedrop-https-later') === '1'; } catch {}
    $('httpsBanner').hidden = !httpsOffered || later;
    $('httpsLinkRow').hidden = !httpsOffered || !later;
  }

  // ---------- synchronizácia ----------
  async function refresh() {
    try {
      const r = await fetch(withKey('/api/state'), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const text = await r.text();
      $('status').className = '';
      if (!state) {
        state = JSON.parse(text);
        state.local ? initPc() : initPhone();
      }
      $('status').textContent = state.local ? t('thisPc') + ' · ' + state.folder
        : t('connected') + (state.secure ? ' · 🔒 ' + t('secureOn') : '');
      if (text === lastJson) return;
      lastJson = text;
      state = JSON.parse(text);
      state.local ? renderPc() : renderPhone();
    } catch {
      $('status').textContent = t('offline');
      $('status').className = 'offline';
    }
  }
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
